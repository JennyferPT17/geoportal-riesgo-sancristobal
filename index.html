<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Geoportal Riesgo de Inundación - San Cristóbal</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; }
  header { background: #1F4E78; color: white; padding: 14px 20px; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: 0.85; }
  .layout { display: flex; height: calc(100vh - 64px); }
  #panel { width: 280px; background: white; padding: 14px; overflow-y: auto; border-right: 1px solid #ddd; }
  #map { flex: 1; }
  .section { margin-bottom: 18px; }
  .section h3 { font-size: 14px; margin: 0 0 8px; color: #1F4E78; border-bottom: 1px solid #eee; padding-bottom: 4px; }
  label { display: flex; align-items: center; gap: 6px; font-size: 13px; margin-bottom: 6px; cursor: pointer; }
  select, button { width: 100%; padding: 6px; font-size: 13px; margin-top: 4px; }
  button { background: #1F4E78; color: white; border: none; border-radius: 4px; padding: 8px; cursor: pointer; }
  button:hover { background: #2E75B6; }
  #stats { font-size: 12px; background: #f4f6f8; padding: 8px; border-radius: 4px; line-height: 1.6; }
  #estado { font-size: 12px; color: #555; min-height: 16px; }
  .swatch { width: 12px; height: 12px; display: inline-block; border-radius: 2px; }
</style>
</head>
<body>

<header>
  <h1>🌊 Geoportal de Riesgo de Inundación — San Cristóbal, Galápagos</h1>
  <p>Consulta si estás en zona de riesgo</p>
</header>

<div class="layout">
  <div id="panel">

    <div class="section">
      <h3>Capas</h3>
      <label><input type="checkbox" data-layer="zona_inundacion" checked> <span class="swatch" style="background:#E31A1C"></span> Zonas de inundación</label>
      <label><input type="checkbox" data-layer="scy_riesgos_vias" checked> <span class="swatch" style="background:#3388ff"></span> Vías</label>
      <label><input type="checkbox" data-layer="scy__riesgos_lugares" checked> <span class="swatch" style="background:#ff7800"></span> Lugares</label>
      <label><input type="checkbox" data-layer="scy_riesgos_poly" checked> <span class="swatch" style="background:#8e44ad"></span> Edificaciones</label>
      <label><input type="checkbox" data-layer="parroquias_scy" checked> <span class="swatch" style="background:#2c3e50"></span> Límites parroquiales</label>
    </div>

    <div class="section">
      <h3>Consulta por nivel de riesgo</h3>
      <select id="filtroRiesgo">
        <option value="">Mostrar todos</option>
        <option value="ALTO">Solo ALTO</option>
        <option value="MEDIO">Solo MEDIO</option>
      </select>
      <button onclick="aplicarFiltroRiesgo()">Consultar</button>
    </div>

    <div class="section">
      <h3>Estadísticas</h3>
      <div id="stats">Cargando datos…</div>
    </div>

    <div class="section">
      <h3>📍 Reporte por mi ubicación</h3>
      <label style="display:block; margin-bottom:4px;">Describe la situación (opcional):</label>
      <textarea id="descripcionReporte" rows="3" placeholder="Ej: Inundación por lluvias intensas, calle anegada, acceso bloqueado..." style="width:100%; padding:6px; font-size:12px; margin-bottom:8px; box-sizing:border-box; font-family:inherit; resize:vertical;"></textarea>
      <button onclick="verificarUbicacion()">Usar mi ubicación</button>
      <div id="resultadoUbicacion" style="margin-top:8px; font-size:12px;"></div>
      <button id="btnDescargarReporte" onclick="descargarReportePDF()" style="display:none; margin-top:6px; background:#555;">Descargar reporte (PDF)</button>
    </div>

    <div class="section">
      <p id="estado"></p>
    </div>

  </div>

  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  const SUPABASE_URL = "https://dxtwlabptqfljrfdywox.supabase.co/rest/v1/";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR4dHdsYWJwdHFmbGpyZmR5d294Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExMzQ4NjMsImV4cCI6MjA5NjcxMDg2M30.U5wVj1fgqFVAZ4Zn_7pbIHLR6PIUGOu1l25kKRwQez0";

  const ESTILOS = {
    zona_inundacion:      { color: "#800000", fillColor: "#E31A1C", weight: 1, fillOpacity: 0.5 },
    scy_riesgos_vias:      { color: "#3388ff", weight: 2 },
    scy_riesgos_poly:      { color: "#8e44ad", fillColor: "#8e44ad", weight: 1, fillOpacity: 0.4 },
    parroquias_scy:        { color: "#2c3e50", weight: 1.5, fillOpacity: 0 },
  };
  const COLOR_PUNTO = { zona_inundacion: null, scy__riesgos_lugares: "#ff7800" };

  // Devuelve el estilo correcto según la tabla y, para zona_inundacion, según su nivel de riesgo
  function estiloParaFeature(tabla, feature) {
    if (tabla === "zona_inundacion") {
      const nivel = feature && feature.properties && feature.properties.nivel_rsgo;
      if (nivel === "ALTO") {
        return { color: "#800000", fillColor: "#E31A1C", weight: 1, fillOpacity: 0.5 };
      }
      if (nivel === "MEDIO") {
        return { color: "#B8860B", fillColor: "#FFD700", weight: 1, fillOpacity: 0.5 };
      }
      return { color: "#800000", fillColor: "#E31A1C", weight: 1, fillOpacity: 0.5 }; // por defecto
    }
    return ESTILOS[tabla] || {};
  }

  const mapa = L.map('map').setView([-0.9, -89.6], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(mapa);

  const capasLeaflet = {};   // nombre_tabla -> L.geoJSON layer
  const datosCache = {};     // nombre_tabla -> array de filas

  function obtenerGeometria(valor) {
    if (!valor) return null;
    if (typeof valor === "object" && valor.type && valor.coordinates) return valor;
    return null;
  }

  // Calcula el centroide aproximado (promedio de vértices) del anillo exterior
  // de un Polygon o MultiPolygon. Devuelve [lon, lat] o null.
  function centroideDeGeometria(geometria) {
    if (!geometria) return null;
    let anillo = null;
    if (geometria.type === "Polygon") {
      anillo = geometria.coordinates[0];
    } else if (geometria.type === "MultiPolygon") {
      // usa el anillo exterior del primer polígono (aproximación suficiente para este filtro)
      anillo = geometria.coordinates[0][0];
    } else {
      return null;
    }
    let sumLon = 0, sumLat = 0;
    anillo.forEach(([lon, lat]) => { sumLon += lon; sumLat += lat; });
    return [sumLon / anillo.length, sumLat / anillo.length];
  }

  function popupTexto(fila) {
    const campos = Object.entries(fila)
      .filter(([k]) => k !== "geom")
      .map(([k, v]) => `<b>${k}:</b> ${v !== null ? v : "-"}`)
      .join("<br>");
    return `<div style="font-size:12px; max-width:220px;">${campos}</div>`;
  }

  async function cargarCapa(tabla) {
    const res = await fetch(SUPABASE_URL + tabla + "?select=*", {
      headers: { apikey: ANON_KEY, Authorization: "Bearer " + ANON_KEY }
    });
    if (!res.ok) throw new Error(tabla + ": HTTP " + res.status);
    let datos = await res.json();

    // La capa de "Lugares" se filtra para mostrar solo los puntos que caen
    // dentro de alguna zona de riesgo (evita un mapa disperso/desordenado)
    if (tabla === "scy__riesgos_lugares") {
      const zonas = datosCache["zona_inundacion"] || [];
      datos = datos.filter(fila => {
        const punto = obtenerGeometria(fila.geom);
        if (!punto || punto.type !== "Point") return false;
        const [lon, lat] = punto.coordinates;
        return zonas.some(z => {
          const geomZona = obtenerGeometria(z.geom);
          return geomZona && puntoEnGeometria([lon, lat], geomZona);
        });
      });
    }

    // La capa de "Edificaciones" se filtra igual: solo se muestran las que
    // caen dentro de alguna zona de riesgo (se usa el centroide del polígono)
    if (tabla === "scy_riesgos_poly") {
      const zonas = datosCache["zona_inundacion"] || [];
      datos = datos.filter(fila => {
        const geomEdif = obtenerGeometria(fila.geom);
        const centroide = centroideDeGeometria(geomEdif);
        if (!centroide) return false;
        return zonas.some(z => {
          const geomZona = obtenerGeometria(z.geom);
          return geomZona && puntoEnGeometria(centroide, geomZona);
        });
      });
    }

    datosCache[tabla] = datos;

    const capa = L.geoJSON([], {
      style: (feature) => estiloParaFeature(tabla, feature),
      pointToLayer: (feature, latlng) => L.circleMarker(latlng, {
        radius: 5, color: "#333", weight: 1,
        fillColor: COLOR_PUNTO[tabla] || "#ff7800", fillOpacity: 0.9
      }),
      onEachFeature: (feature, layer) => layer.bindPopup(popupTexto(feature.properties))
    });

    datos.forEach(fila => {
      const geom = obtenerGeometria(fila.geom);
      if (geom) capa.addData({ type: "Feature", geometry: geom, properties: fila });
    });

    capa.addTo(mapa);
    capasLeaflet[tabla] = capa;
    return datos.length;
  }

  const NOMBRE_AMIGABLE = {
    zona_inundacion: "Zonas de inundación",
    scy_riesgos_vias: "Vías",
    scy__riesgos_lugares: "Lugares (en zona de riesgo)",
    scy_riesgos_poly: "Edificaciones",
    parroquias_scy: "Límites parroquiales"
  };

  async function cargarTodo() {
    const estado = document.getElementById("estado");
    const tablas = ["zona_inundacion", "scy_riesgos_vias", "scy__riesgos_lugares", "scy_riesgos_poly", "parroquias_scy"];
    let resumen = [];
    for (const t of tablas) {
      try {
        const n = await cargarCapa(t);
        resumen.push({ tabla: t, n });
      } catch (e) {
        resumen.push({ tabla: t, n: "ERROR" });
      }
    }
    document.getElementById("stats").innerHTML = resumen.map(r =>
      `<div>${NOMBRE_AMIGABLE[r.tabla] || r.tabla}: <b>${r.n}</b> registros</div>`
    ).join("");
    estado.innerText = "Datos cargados correctamente.";

    // Ajustar vista a todas las capas cargadas
    const grupo = L.featureGroup(Object.values(capasLeaflet));
    if (grupo.getLayers().length > 0) mapa.fitBounds(grupo.getBounds(), { padding: [20, 20] });
  }

  // Checkboxes: mostrar/ocultar capas
  document.querySelectorAll('input[data-layer]').forEach(chk => {
    chk.addEventListener('change', () => {
      const capa = capasLeaflet[chk.dataset.layer];
      if (!capa) return;
      if (chk.checked) mapa.addLayer(capa); else mapa.removeLayer(capa);
    });
  });

  // Herramienta de consulta: filtrar zona_inundacion por nivel de riesgo
  async function aplicarFiltroRiesgo() {
    const nivel = document.getElementById("filtroRiesgo").value;
    const estado = document.getElementById("estado");
    estado.innerText = "Consultando...";

    const url = SUPABASE_URL + "zona_inundacion?select=*" + (nivel ? `&nivel_rsgo=eq.${nivel}` : "");
    const res = await fetch(url, { headers: { apikey: ANON_KEY, Authorization: "Bearer " + ANON_KEY } });
    const datos = await res.json();

    if (capasLeaflet["zona_inundacion"]) mapa.removeLayer(capasLeaflet["zona_inundacion"]);
    const capa = L.geoJSON([], {
      style: (feature) => estiloParaFeature("zona_inundacion", feature),
      onEachFeature: (f, l) => l.bindPopup(popupTexto(f.properties))
    });
    datos.forEach(fila => {
      const geom = obtenerGeometria(fila.geom);
      if (geom) capa.addData({ type: "Feature", geometry: geom, properties: fila });
    });
    capa.addTo(mapa);
    capasLeaflet["zona_inundacion"] = capa;

    estado.innerText = `Consulta aplicada: ${datos.length} zona(s) ${nivel ? "de nivel " + nivel : "(todas)"}.`;
    if (datos.length > 0) {
      const grupo = L.featureGroup([capa]);
      mapa.fitBounds(grupo.getBounds(), { padding: [20, 20] });
    }
  }

  cargarTodo();

  // ===================== REPORTE POR UBICACIÓN =====================

  let ultimoReporte = null;      // guarda los datos del último chequeo para el botón de descarga
  let marcadorUsuario = null;    // marcador de la ubicación del usuario en el mapa
  let circuloRadio = null;

  // Algoritmo ray-casting: determina si un punto [lon,lat] está dentro de un anillo de un polígono
  function puntoEnAnillo(punto, anillo) {
    const [x, y] = punto;
    let dentro = false;
    for (let i = 0, j = anillo.length - 1; i < anillo.length; j = i++) {
      const [xi, yi] = anillo[i];
      const [xj, yj] = anillo[j];
      const interseca = ((yi > y) !== (yj > y)) &&
        (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
      if (interseca) dentro = !dentro;
    }
    return dentro;
  }

  // Verifica si un punto [lon,lat] está dentro de una geometría Polygon o MultiPolygon
  function puntoEnGeometria(punto, geometria) {
    if (!geometria) return false;
    if (geometria.type === "Polygon") {
      // El primer anillo es el exterior; los siguientes son huecos
      if (!puntoEnAnillo(punto, geometria.coordinates[0])) return false;
      for (let i = 1; i < geometria.coordinates.length; i++) {
        if (puntoEnAnillo(punto, geometria.coordinates[i])) return false; // está en un hueco
      }
      return true;
    }
    if (geometria.type === "MultiPolygon") {
      return geometria.coordinates.some(poligono => {
        if (!puntoEnAnillo(punto, poligono[0])) return false;
        for (let i = 1; i < poligono.length; i++) {
          if (puntoEnAnillo(punto, poligono[i])) return false;
        }
        return true;
      });
    }
    return false;
  }

  // Distancia aproximada (m) de un punto a los vértices de una geometría (para saber "qué tan cerca" si no está dentro)
  function distanciaAproximadaM(lat, lon, geometria) {
    const R = 6371000;
    function hav(lat1, lon1, lat2, lon2) {
      const toRad = d => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }
    let min = Infinity;
    const anillos = geometria.type === "Polygon" ? [geometria.coordinates[0]]
      : geometria.type === "MultiPolygon" ? geometria.coordinates.map(pg => pg[0]) : [];
    anillos.forEach(anillo => {
      anillo.forEach(([lon2, lat2]) => {
        const d = hav(lat, lon, lat2, lon2);
        if (d < min) min = d;
      });
    });
    return min;
  }

  function verificarUbicacion() {
    const resultado = document.getElementById("resultadoUbicacion");
    if (!navigator.geolocation) {
      resultado.innerHTML = "Tu navegador no soporta geolocalización.";
      return;
    }
    resultado.innerHTML = "Obteniendo tu ubicación…";

    navigator.geolocation.getCurrentPosition(pos => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const zonas = datosCache["zona_inundacion"] || [];

      // Marcar al usuario en el mapa
      if (marcadorUsuario) mapa.removeLayer(marcadorUsuario);
      marcadorUsuario = L.marker([lat, lon], {
        icon: L.divIcon({ className: '', html: '📍', iconSize: [24, 24] })
      }).addTo(mapa).bindPopup("Tu ubicación").openPopup();
      mapa.setView([lat, lon], 15);

      // Verificar si está dentro de alguna zona de riesgo
      let zonaEncontrada = null;
      for (const fila of zonas) {
        const geom = obtenerGeometria(fila.geom);
        if (geom && puntoEnGeometria([lon, lat], geom)) {
          zonaEncontrada = fila;
          break;
        }
      }

      let mensaje, nivel, distancia = null;
      if (zonaEncontrada) {
        nivel = zonaEncontrada.nivel_rsgo;
        const color = nivel === "ALTO" ? "#E31A1C" : "#FFA500";
        mensaje = `<div style="padding:8px; background:${color}22; border-left:4px solid ${color};">
          ⚠️ <b>Estás dentro de una zona de riesgo ${nivel}</b></div>`;
      } else {
        // Buscar distancia a la zona ALTO más cercana
        let minDist = Infinity;
        zonas.forEach(fila => {
          if (fila.nivel_rsgo === "ALTO") {
            const geom = obtenerGeometria(fila.geom);
            if (geom) {
              const d = distanciaAproximadaM(lat, lon, geom);
              if (d < minDist) minDist = d;
            }
          }
        });
        distancia = minDist;
        nivel = "FUERA DE ZONA DE RIESGO";
        mensaje = `<div style="padding:8px; background:#2ecc7122; border-left:4px solid #2ecc71;">
          ✅ <b>No estás dentro de una zona de riesgo mapeada</b><br>
          Zona ALTO más cercana: ~${Math.round(minDist)} m</div>`;
      }

      resultado.innerHTML = mensaje;

      const descripcion = document.getElementById("descripcionReporte").value.trim();

      ultimoReporte = {
        fecha: new Date().toLocaleString('es-EC'),
        lat: lat,
        lon: lon,
        precision: Math.round(pos.coords.accuracy),
        nivel: nivel,
        distanciaZonaAlto: distancia !== null ? Math.round(distancia) : null,
        descripcion: descripcion || "No especificado"
      };
      document.getElementById("btnDescargarReporte").style.display = "block";

      // Guardar automáticamente el reporte en Supabase
      guardarReporteEnSupabase(ultimoReporte);

    }, err => {
      resultado.innerHTML = "No se pudo obtener tu ubicación: " + err.message +
        "<br><small>Verifica que hayas dado permiso de ubicación al navegador.</small>";
    }, { enableHighAccuracy: true, timeout: 10000 });
  }

  // Guarda el reporte en la tabla reportes_ubicacion vía API REST de Supabase (INSERT)
  async function guardarReporteEnSupabase(r) {
    try {
      await fetch(SUPABASE_URL + "reportes_ubicacion", {
        method: "POST",
        headers: {
          apikey: ANON_KEY,
          Authorization: "Bearer " + ANON_KEY,
          "Content-Type": "application/json",
          Prefer: "return=minimal"
        },
        body: JSON.stringify({
          lat: r.lat,
          lon: r.lon,
          precision_gps: r.precision,
          nivel_riesgo: r.nivel,
          distancia_zona_alto_m: r.distanciaZonaAlto,
          descripcion: r.descripcion
        })
      });
    } catch (e) {
      console.error("No se pudo guardar el reporte en Supabase:", e);
    }
  }

  // Genera un PDF descargable con jsPDF a partir del último reporte generado
  function descargarReportePDF() {
    if (!ultimoReporte) return;
    const r = ultimoReporte;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.setFontSize(14);
    doc.setFont(undefined, "bold");
    doc.text("Reporte de Riesgo de Inundación", 15, 20);
    doc.text("San Cristóbal, Galápagos", 15, 28);

    doc.setDrawColor(31, 78, 120);
    doc.line(15, 32, 195, 32);

    doc.setFontSize(11);
    doc.setFont(undefined, "normal");
    let y = 44;
    const filas = [
      ["Fecha y hora de generación", r.fecha],
      ["Coordenadas (lat, lon)", `${r.lat.toFixed(6)}, ${r.lon.toFixed(6)}`],
      ["Precisión del GPS", `${r.precision} m`],
      ["Nivel de riesgo detectado", r.nivel],
      ["Distancia a zona ALTO", r.distanciaZonaAlto !== null ? `${r.distanciaZonaAlto} m` : "N/A (ya está dentro)"],
    ];
    filas.forEach(([label, val]) => {
      doc.setFont(undefined, "bold");
      doc.text(label + ":", 15, y);
      doc.setFont(undefined, "normal");
      doc.text(String(val), 90, y);
      y += 9;
    });

    y += 2;
    doc.setFont(undefined, "bold");
    doc.text("Descripción de la situación:", 15, y);
    y += 7;
    doc.setFont(undefined, "normal");
    doc.text(doc.splitTextToSize(r.descripcion, 180), 15, y);
    y += Math.ceil(doc.splitTextToSize(r.descripcion, 180).length * 6) + 8;

    doc.setFontSize(9);
    doc.setTextColor(100);
    const nota = "Este reporte fue generado automáticamente por el Geoportal de Riesgo de Inundación de " +
      "San Cristóbal, a partir de la ubicación GPS del dispositivo y las zonas de riesgo almacenadas en " +
      "la base de datos PostGIS (tabla zona_inundacion). Una copia de este reporte quedó registrada en el " +
      "sistema para consulta del administrador.";
    doc.text(doc.splitTextToSize(nota, 180), 15, y);

    doc.save(`reporte_riesgo_${Date.now()}.pdf`);
  }
</script>

</body>
</html>
